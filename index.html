<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prépa Habilitation Fluide CAT 1-5</title>
<meta name="description" content="Révision pour l'habilitation à la manipulation des fluides frigorigènes CAT 1-5.">
<meta name="theme-color" content="#0f1720">
<script>
  /* Applique le thème avant le premier rendu (pas de flash) */
  (function () {
    try {
      var t = localStorage.getItem("prepafrigo_theme");
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  })();
</script>
<link rel="stylesheet" href="style.css">

<!-- PWA / installable app -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrépaFrigo">
</head>
<body>
<div id="app">
  <nav id="sidebar" class="drawer" aria-label="Navigation principale"></nav>

  <div class="main-col">
    <header class="appbar">
      <button id="menuBtn" class="icon-btn" aria-label="Ouvrir le menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="appbar-title" id="appbarTitle">Accueil</div>
      <div class="appbar-prog" id="appbarProg" title="Progression globale"></div>
      <button id="themeBtn" class="icon-btn" aria-label="Changer le thème"></button>
    </header>

    <main id="main" class="content"></main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
